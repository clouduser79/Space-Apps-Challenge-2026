name: Build Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name SpaceMissionGame `
            --add-data "src/data;src/data" `
            --add-data "planetImages;planetImages" `
            --add-data "rocket.png;." `
            --collect-all customtkinter `
            --collect-all PIL `
            src/main.py

      - name: Upload exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpaceMissionGame.exe
          generate_release_notes: true

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build app bundle
        run: |
          pyinstaller --noconfirm --windowed \
            --name SpaceMissionGame \
            --add-data "src/data:src/data" \
            --add-data "planetImages:planetImages" \
            --add-data "rocket.png:." \
            --collect-all customtkinter \
            --collect-all PIL \
            src/main.py

      - name: Download GMAT for macOS
        run: |
          curl -fL -o gmat.dmg \
            "https://sourceforge.net/projects/gmat/files/GMAT/GMAT-R2026a/gmat-mac-x64-R2026a-signed.dmg/download"

      - name: Mount GMAT dmg and bundle into app
        run: |
          hdiutil attach gmat.dmg -nobrowse -readonly
          VOL=$(ls -d /Volumes/GMAT* | head -1)
          mkdir -p dist/SpaceMissionGame.app/Contents/Resources/gmat-mac
          # The dmg contains a "GMAT R2026a" folder; copy its contents
          cp -R "$VOL"/GMAT*/. dist/SpaceMissionGame.app/Contents/Resources/gmat-mac/
          hdiutil detach "$VOL"
          rm gmat.dmg
          # GMAT needs bin/GmatConsole + data/ at minimum
          test -x dist/SpaceMissionGame.app/Contents/Resources/gmat-mac/bin/GmatConsole

      - name: Ad-hoc sign the app
        run: codesign --force --deep --sign - dist/SpaceMissionGame.app

      - name: Package DMG
        run: |
          mkdir -p dmg_root
          cp -R dist/SpaceMissionGame.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname SpaceMissionGame \
            -srcfolder dmg_root \
            -ov -format UDZO \
            dist/SpaceMissionGame.dmg

      - name: Upload dmg to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SpaceMissionGame.dmg
          generate_release_notes: true
